
<div class="container my-5">
    <hr>
  <h2 class="mb-3 skills-heading">Technical Skills</h2>
  <div class="accordion" id="skillsAccordion">
    @for (skill of skills; let i = $index; track i) {
      <div class="accordion-item">
        <h2 class="accordion-header" id="heading{{ i }}">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                  [attr.data-bs-target]="'#collapse' + i" aria-expanded="false"
                  [attr.aria-controls]="'collapse' + i">
           <strong>{{ skill.category }}</strong>
          </button>
        </h2>
        <div [id]="'collapse' + i" class="accordion-collapse collapse"
             [attr.aria-labelledby]="'heading' + i" data-bs-parent="#skillsAccordion">
          <div class="accordion-body">
            <div class="d-flex flex-wrap gap-2">
                <span>{{ skill.items.join(', ') }}</span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
